# Airflow Configuration for DBT Multi-Client Setup

[core]
# The home folder for airflow, default is ~/airflow
airflow_home = /opt/airflow

# The folder where your airflow DAGs are stored
dags_folder = /opt/airflow/dags

# The folder where airflow plugins are stored
plugins_folder = /opt/airflow/plugins

# Base log folder
base_log_folder = /opt/airflow/logs

# Logging level
logging_level = INFO

# The executor class that airflow should use
executor = LocalExecutor

# Whether to load the DAG examples that ship with Airflow
load_examples = False

# Whether to load the default connections that ship with Airflow
load_default_connections = True

[webserver]
# The base URL of your website
base_url = http://localhost:8080

# Default timezone to display all dates in the web UI
default_ui_timezone = UTC

# Number of seconds the webserver waits before killing gunicorn master
web_server_master_timeout = 120

[scheduler]
# How often (in seconds) to scan the DAGs directory for new files
dag_dir_list_interval = 300

# How often (in seconds) to check if a DAG run is ready to be scheduled
min_file_process_interval = 0

# Number of seconds after which a DAG file is parsed
dag_file_processor_timeout = 50

[database]
# SQLAlchemy connection string
sql_alchemy_conn = postgresql+psycopg2://airflow:airflow@postgres/airflow

[email]
# Email backend to use
email_backend = airflow.providers.sendgrid.utils.emailer.send_email

[dbt]
# DBT project settings
dbt_project_path = /opt/airflow/dbt_project
dbt_profiles_dir = /opt/airflow/dbt_project
default_environment = dev

[clients]
# Client configurations
client_a_dataset = DBT_VISHAL_DATASET
client_b_dataset = DBT_client_b_DATASET
bigquery_project = gen-lang-client-0522732935
bigquery_location = northamerica-northeast1
